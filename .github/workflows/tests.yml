name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3.36", "8.4.27"]
        laravel: ["10.*", "11.*", "12.*"]
        postgres: ["13", "14", "15", "16"]
        include:
          - laravel: "10.*"
            testbench: "8.*"
          - laravel: "11.*"
            testbench: "9.*"
          - laravel: "12.*"
            testbench: "10.*"

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - PG${{ matrix.postgres }}

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres_helper_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath
          coverage: none

      - name: Verify PHP ${{ matrix.php }}
        env:
          EXPECTED_PHP_VERSION: ${{ matrix.php }}
        run: |
          case "$EXPECTED_PHP_VERSION" in
            8.3.36) expected=80336 ;;
            8.4.27) expected=80427 ;;
            *) echo "::error::Unexpected PHP matrix value: $EXPECTED_PHP_VERSION"; exit 1 ;;
          esac
          actual=$(php -r 'echo PHP_VERSION_ID;')
          if [ "$actual" -ne "$expected" ]; then
            actual_version=$(php -r 'echo PHP_VERSION;')
            printf 'Expected PHP %s (PHP_VERSION_ID %s); got %s (PHP_VERSION_ID %s)\n' "$EXPECTED_PHP_VERSION" "$expected" "$actual_version" "$actual" >&2
            exit 1
          fi

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: postgres_helper_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres

  lint:
    runs-on: haakco-build
    container:
      image: ghcr.io/haakco/actions-runner:2
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    name: Lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3.36"
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, bcmath
          coverage: none

      - name: Verify PHP 8.3.36
        run: php -r 'if (PHP_VERSION_ID !== 80336) { fwrite(STDERR, "Expected PHP 8.3.36 (PHP_VERSION_ID 80336); got " . PHP_VERSION . " (PHP_VERSION_ID " . PHP_VERSION_ID . ")" . PHP_EOL); exit(1); }'

      - name: Install dependencies
        run: composer install --prefer-stable --prefer-dist --no-interaction

      - name: Execute linting
        run: composer lint-check
